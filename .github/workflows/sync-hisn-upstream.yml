name: Sync Hisn upstream databases

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1

      - name: Update HisnElmoslem_App submodule
        run: git submodule update --remote packages/HisnElmoslem_App

      - name: Sync database assets
        working-directory: packages/hisn_elmoslem
        run: dart run tool/sync_upstream.dart

      - name: Run package tests
        working-directory: packages/hisn_elmoslem
        run: dart test

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(hisn_elmoslem): sync upstream databases'
          title: 'chore(hisn_elmoslem): sync upstream databases'
          body: |
            Automated sync of Hisn al-Muslim SQLite databases from
            [muslimpack/HisnElmoslem_App](https://github.com/muslimpack/HisnElmoslem_App).
          branch: chore/sync-hisn-upstream
          add-paths: |
            packages/hisn_elmoslem/assets/database/
            packages/hisn_elmoslem/assets/upstream.lock.json
            packages/HisnElmoslem_App
