name: Quality

# Required checks for pull requests and main. This workflow never builds an
# installer, sets a release version, tags, or publishes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-flutter

      - name: App checks
        run: bash tool/checks.sh app

  packages:
    name: Local package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-flutter

      - name: Local package checks
        run: bash tool/checks.sh packages
