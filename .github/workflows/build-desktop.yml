name: Build desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - patch
          - build
      platforms:
        description: 'Target platforms (comma-separated: macos,windows,linux)'
        required: false
        default: 'macos,windows,linux'
        type: string
      release_version:
        description: 'Shorebird patch target release version (e.g. 1.0.0+1). Leave blank for latest.'
        required: false
        type: string

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Codegen (packages then app)
        run: bash tool/codegen.sh
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  macos:
    name: macOS (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    if: >-
      github.event_name == 'push' ||
      contains(github.event.inputs.platforms || 'macos,windows,linux', 'macos')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set version from release tag
        if: github.event_name == 'push'
        run: dart tool/set_pubspec_version.dart "${GITHUB_REF_NAME#v}+${{ github.run_number }}"

      - name: Setup Shorebird
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.action == 'release' ||
          github.event.inputs.action == 'patch'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Codegen (packages then app)
        run: bash tool/codegen.sh

      # Shorebird Release (Tag push or manual 'release')
      - name: Shorebird release
        if: >-
          matrix.architecture == 'arm64' && (
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release')
          )
        run: |
          BUILD_NAME="$(sed -n "s/^version: *\([^+]*\).*/\1/p" pubspec.yaml | head -n1)"
          if [ "${{ github.event_name }}" = "push" ]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          fi
          shorebird release macos \
            --build-name "$BUILD_NAME" \
            --build-number "${{ github.run_number }}"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # Shorebird Patch (Manual 'patch')
      - name: Shorebird patch
        if: matrix.architecture == 'arm64' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'patch'
        run: |
          shorebird patch macos \
            ${{ github.event.inputs.release_version != '' && format('--release-version {0}', github.event.inputs.release_version) || '' }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # Flutter Build (Manual 'build')
      - name: Flutter build (no Shorebird)
        if: matrix.architecture == 'arm64' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build'
        run: flutter build macos --release --build-number ${{ github.run_number }}

      - name: Flutter build (Intel)
        if: matrix.architecture == 'x64' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch'))
        run: flutter build macos --release --build-number ${{ github.run_number }}

      # Packaging (.dmg) - Only for release or build (not patch)
      - name: Ad-hoc sign
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/Tawaq.app

      - name: Install create-dmg
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        run: brew install create-dmg

      - name: Package DMG
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        run: |
          mkdir -p dist
          create-dmg \
            --volname "Tawaq" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Tawaq.app" 180 170 \
            --app-drop-link 480 170 \
            --hide-extension "Tawaq.app" \
            "dist/tawaq-macos-${{ matrix.architecture }}.dmg" \
            "build/macos/Build/Products/Release/Tawaq.app" \
          || test $? -eq 2

      - name: Package installer archive
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        run: |
          VERSION="$(sed -n "s/^version: *\([^+]*\).*/\1/p" pubspec.yaml | head -n1)"
          ARCHIVE_ROOT="tawaq-${VERSION}-macos-${{ matrix.architecture }}"
          STAGING="$RUNNER_TEMP/$ARCHIVE_ROOT"
          mkdir -p "$STAGING"
          ditto "build/macos/Build/Products/Release/Tawaq.app" "$STAGING/Tawaq.app"
          cp tool/packaging/installers/macos/install.sh "$STAGING/install.sh"
          cp tool/packaging/installers/macos/INSTALL.md "$STAGING/INSTALL.md"
          chmod +x "$STAGING/install.sh"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$STAGING" "dist/$ARCHIVE_ROOT-installer.zip"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        with:
          name: tawaq-macos-${{ matrix.architecture }}
          path: dist/*
          retention-days: 7

  windows:
    name: Windows
    runs-on: windows-latest
    if: >-
      github.event_name == 'push' ||
      contains(github.event.inputs.platforms || 'macos,windows,linux', 'windows')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set version from release tag
        if: github.event_name == 'push'
        shell: bash
        run: dart tool/set_pubspec_version.dart "${GITHUB_REF_NAME#v}+${{ github.run_number }}"

      - name: Setup Shorebird
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.action == 'release' ||
          github.event.inputs.action == 'patch'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Codegen (packages then app)
        shell: bash
        run: bash tool/codegen.sh

      # Shorebird Release (Tag push or manual 'release')
      - name: Shorebird release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release')
        shell: bash
        run: |
          BUILD_NAME="$(sed -n "s/^version: *\([^+]*\).*/\1/p" pubspec.yaml | head -n1)"
          if [ "${{ github.event_name }}" = "push" ]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          fi
          shorebird release windows \
            --build-name "$BUILD_NAME" \
            --build-number "${{ github.run_number }}"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # Shorebird Patch (Manual 'patch')
      - name: Shorebird patch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'patch'
        run: |
          shorebird patch windows \
            ${{ github.event.inputs.release_version != '' && format('--release-version {0}', github.event.inputs.release_version) || '' }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # Flutter Build (Manual 'build')
      - name: Flutter build (no Shorebird)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build'
        run: flutter build windows --release --build-number ${{ github.run_number }}

      # Packaging (Inno Setup EXE) - Only for release or build (not patch)
      - name: Install Inno Setup
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package EXE installer
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: (.+)\+').Matches[0].Groups[1].Value
          iscc /DAppVersion="$version" /DBuildNumber="${{ github.run_number }}" tool/packaging/inno-setup.iss

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        with:
          name: tawaq-windows
          path: dist/tawaq-*-setup.exe
          retention-days: 7

  linux:
    name: Linux
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      contains(github.event.inputs.platforms || 'macos,windows,linux', 'linux')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set version from release tag
        if: github.event_name == 'push'
        run: dart tool/set_pubspec_version.dart "${GITHUB_REF_NAME#v}+${{ github.run_number }}"

      - name: Install Linux build & packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libnotify-dev \
            libmpv-dev \
            rpm \
            zip \
            zstd \
            dpkg

      - name: Setup Shorebird
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.action == 'release' ||
          github.event.inputs.action == 'patch'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Codegen (packages then app)
        run: bash tool/codegen.sh

      # Shorebird Release (Tag push or manual 'release')
      - name: Shorebird release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release')
        run: |
          BUILD_NAME="$(sed -n "s/^version: *\([^+]*\).*/\1/p" pubspec.yaml | head -n1)"
          if [ "${{ github.event_name }}" = "push" ]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          fi
          shorebird release linux \
            --build-name "$BUILD_NAME" \
            --build-number "${{ github.run_number }}"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # Shorebird Patch (Manual 'patch')
      - name: Shorebird patch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'patch'
        run: |
          shorebird patch linux \
            ${{ github.event.inputs.release_version != '' && format('--release-version {0}', github.event.inputs.release_version) || '' }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # Flutter Build (Manual 'build')
      - name: Flutter build (no Shorebird)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build'
        run: flutter build linux --release --build-number ${{ github.run_number }}

      # Packaging (.deb, .rpm, .pkg.tar.zst, portable ZIP) - Only for release or build (not patch)
      - name: Package Linux installers and portable ZIP
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        run: |
          export BUILD_NUMBER="${{ github.run_number }}"
          bash tool/packaging/build-deb.sh
          bash tool/packaging/build-rpm.sh
          bash tool/packaging/build-arch.sh
          VERSION="$(sed -n "s/^version: *\([^+]*\).*/\1/p" pubspec.yaml | head -n1)"
          mkdir -p dist
          ARCHIVE_ROOT="tawaq-${VERSION}-linux-x64"
          STAGING="$RUNNER_TEMP/$ARCHIVE_ROOT"
          mkdir -p "$STAGING/app" "$STAGING/icons"
          cp -R build/linux/x64/release/bundle/. "$STAGING/app/"
          cp -R linux/icons/hicolor "$STAGING/icons/hicolor"
          cp tool/packaging/installers/linux/install.sh "$STAGING/install.sh"
          cp tool/packaging/installers/linux/INSTALL.md "$STAGING/INSTALL.md"
          chmod +x "$STAGING/install.sh"
          (
            cd "$RUNNER_TEMP"
            zip -r -q "$GITHUB_WORKSPACE/dist/$ARCHIVE_ROOT.zip" "$ARCHIVE_ROOT"
          )

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        with:
          name: tawaq-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.zip
          retention-days: 7

  release:
    name: Publish release
    if: >-
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release'))
    needs: [checks, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Detect prerelease & tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //' | sed 's/+.*//' | tr -d '"' | tr -d "'")
            TAG="v${VERSION}"
          fi

          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release checksums
        run: |
          shopt -s nullglob
          assets=(
            tawaq-macos-*.dmg
            tawaq-*-macos-*-installer.zip
            tawaq-*-windows-x64-setup.exe
            tawaq-*-linux-x64.zip
            *.deb
            *.rpm
            *.pkg.tar.zst
          )
          sha256sum "${assets[@]}" > SHA256SUMS

      - name: Publish installers via Fastforge
        run: |
          REPO="MoathCodes/tawaq-app"
          TAG="${{ steps.meta.outputs.tag }}"
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"

          for file in tawaq-macos-*.dmg tawaq-*-macos-*-installer.zip tawaq-*-windows-x64-setup.exe tawaq-*-linux-x64.zip *.deb *.rpm *.pkg.tar.zst SHA256SUMS; do
            if [ -f "$file" ]; then
              echo "==> Publishing $file to $REPO ($TAG, prerelease=$PRERELEASE)"
              fastforge publish \
                --path "$file" \
                --targets github \
                --github-repo "$REPO" \
                --github-release-title "$TAG" \
                --github-release-prerelease "$PRERELEASE"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
