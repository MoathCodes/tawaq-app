name: Build desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'build'
        type: choice
        options:
          - release
          - patch
          - build
      platforms:
        description: 'Target platforms (comma-separated: macos,windows,linux)'
        required: false
        default: 'macos,windows,linux'
        type: string
      release_version:
        description: 'Explicit reviewed Shorebird patch target (required for patch).'
        required: false
        type: string
      native_acceptance:
        description: 'Reviewed JSON: exact SHA/SDK, all native RC scenarios, signing policy, full staged artifact URLs/checksums. Required for release/patch.'
        required: false
        type: string

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: App and local package checks
        run: bash tool/checks.sh all

  native_gate:
    name: Verify coordinated native candidate
    needs: [checks]
    if: github.event_name == 'push' || github.event.inputs.action != 'build'
    runs-on: ubuntu-latest
    environment: coordinated-desktop-release
    outputs:
      build_name: ${{ steps.review.outputs.build_name }}
      build_number: ${{ steps.review.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed evidence and download every candidate artifact
        id: review
        env:
          NATIVE_ACCEPTANCE: ${{ github.event.inputs.native_acceptance }}
          TARGET_PLATFORMS: ${{ github.event.inputs.platforms || 'macos,windows,linux' }}
          DISTRIBUTION_ACTION: ${{ github.event.inputs.action || 'release' }}
          PATCH_TARGET: ${{ github.event.inputs.release_version }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path("native-acceptance.json").write_text(os.environ["NATIVE_ACCEPTANCE"])'
          SDK=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')
          python3 tool/release/validate_acceptance.py --record native-acceptance.json \
            --revision "$GITHUB_SHA" --sdk "$SDK" --platforms "$TARGET_PLATFORMS" \
            --action "$DISTRIBUTION_ACTION" --release-version "$PATCH_TARGET" --download-to reviewed-candidate
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 -c 'import json,os; record=json.load(open("native-acceptance.json")); assert os.environ["GITHUB_REF_NAME"] == "v" + record["build_name"], "Tag differs from reviewed build name"'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-candidate
          path: reviewed-candidate/*
          if-no-files-found: error


  macos:
    needs: [checks, native_gate]
    env:
      REVIEWED_BUILD_NAME: ${{ needs.native_gate.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.native_gate.outputs.build_number || github.run_number }}
    name: macOS (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    if: >-
      always() && needs.checks.result == 'success' &&
      (needs.native_gate.result == 'success' || needs.native_gate.result == 'skipped') &&
      (github.event_name == 'push' || contains(github.event.inputs.platforms || 'macos,windows,linux', 'macos'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Apply candidate build identity
        run: dart tool/set_pubspec_version.dart --build-number "$BUILD_NUMBER" --build-name "$REVIEWED_BUILD_NAME"

      - name: Setup Shorebird
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.action == 'release' ||
          github.event.inputs.action == 'patch' ||
          github.event.inputs.action == 'build'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Codegen (packages then app)
        run: bash tool/codegen.sh

      # Shorebird Release (Tag push or manual 'release')
      - name: Shorebird release
        if: >-
          matrix.architecture == 'arm64' && (
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release')
          )
        run: |
          BUILD_NAME="$(sed -n "s/^version: *\([^+]*\).*/\1/p" pubspec.yaml | head -n1)"
          shorebird release macos \
            --flutter-version 3.47.5 \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # Shorebird Patch (Manual 'patch')
      - name: Shorebird patch
        if: matrix.architecture == 'arm64' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'patch'
        run: |
          shorebird patch macos \
            --release-version "$PATCH_TARGET"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          PATCH_TARGET: ${{ github.event.inputs.release_version }}

      # Flutter Build (Manual 'build')
      - name: Candidate build (no upload)
        if: matrix.architecture == 'arm64' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build'
        run: shorebird release macos --dry-run --flutter-version 3.47.5 --build-number ${{ env.BUILD_NUMBER }}

      - name: Flutter build (Intel)
        if: matrix.architecture == 'x64' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch'))
        run: flutter build macos --release --build-number ${{ env.BUILD_NUMBER }}

      # Packaging (.dmg) - Only for release or build (not patch)
      - name: Ad-hoc sign
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/Tawaq.app

      - name: Install create-dmg
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        run: brew install create-dmg

      - name: Package DMG
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        run: |
          mkdir -p dist
          create-dmg \
            --volname "Tawaq" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Tawaq.app" 180 170 \
            --app-drop-link 480 170 \
            --hide-extension "Tawaq.app" \
            "dist/tawaq-macos-${{ matrix.architecture }}.dmg" \
            "build/macos/Build/Products/Release/Tawaq.app" \
          || test $? -eq 2

      - name: Package installer archive
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        run: |
          VERSION="$(sed -n "s/^version: *\([^+]*\).*/\1/p" pubspec.yaml | head -n1)"
          ARCHIVE_ROOT="tawaq-${VERSION}-macos-${{ matrix.architecture }}"
          STAGING="$RUNNER_TEMP/$ARCHIVE_ROOT"
          mkdir -p "$STAGING"
          ditto "build/macos/Build/Products/Release/Tawaq.app" "$STAGING/Tawaq.app"
          cp tool/packaging/installers/macos/install.sh "$STAGING/install.sh"
          cp tool/packaging/installers/macos/INSTALL.md "$STAGING/INSTALL.md"
          chmod +x "$STAGING/install.sh"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$STAGING" "dist/$ARCHIVE_ROOT-installer.zip"

      - name: Record actual candidate toolchain
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        shell: bash
        run: python3 tool/release/record_toolchain.py --platform macos-${{ matrix.architecture }} --output dist/toolchain-macos-${{ matrix.architecture }}.json --tool 'shorebird=shorebird --version' --tool 'create-dmg=brew list --versions create-dmg' --tool 'xcode=xcodebuild -version'

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        with:
          name: tawaq-macos-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: [checks, native_gate]
    env:
      REVIEWED_BUILD_NAME: ${{ needs.native_gate.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.native_gate.outputs.build_number || github.run_number }}
    name: Windows
    runs-on: windows-latest
    if: >-
      always() && needs.checks.result == 'success' &&
      (needs.native_gate.result == 'success' || needs.native_gate.result == 'skipped') &&
      (github.event_name == 'push' || contains(github.event.inputs.platforms || 'macos,windows,linux', 'windows'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Apply candidate build identity
        shell: bash
        run: dart tool/set_pubspec_version.dart --build-number "$BUILD_NUMBER" --build-name "$REVIEWED_BUILD_NAME"

      - name: Setup Shorebird
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.action == 'release' ||
          github.event.inputs.action == 'patch' ||
          github.event.inputs.action == 'build'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Codegen (packages then app)
        shell: bash
        run: bash tool/codegen.sh

      # Shorebird Release (Tag push or manual 'release')
      - name: Shorebird release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release')
        shell: bash
        run: |
          BUILD_NAME="$(sed -n "s/^version: *\([^+]*\).*/\1/p" pubspec.yaml | head -n1)"
          shorebird release windows \
            --flutter-version 3.47.5 \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # Shorebird Patch (Manual 'patch')
      - name: Shorebird patch
        shell: bash
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'patch'
        run: |
          shorebird patch windows \
            --release-version "$PATCH_TARGET"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          PATCH_TARGET: ${{ github.event.inputs.release_version }}

      # Flutter Build (Manual 'build')
      - name: Candidate build (no upload)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build'
        run: shorebird release windows --dry-run --flutter-version 3.47.5 --build-number ${{ env.BUILD_NUMBER }}

      # Packaging (Inno Setup EXE) - Only for release or build (not patch)
      - name: Install Inno Setup
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package EXE installer
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: (.+)\+').Matches[0].Groups[1].Value
          iscc /DAppVersion="$version" /DBuildNumber="$env:BUILD_NUMBER" tool/packaging/inno-setup.iss

      - name: Record actual candidate toolchain
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        shell: bash
        run: python3 tool/release/record_toolchain.py --platform windows-x64 --output dist/toolchain-windows-x64.json --tool 'shorebird=shorebird --version' --tool 'inno-setup=powershell -NoProfile -Command "(Get-Item (Get-Command iscc).Source).VersionInfo.FileVersion"'

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        with:
          name: tawaq-windows
          path: |
            dist/tawaq-*-setup.exe
            dist/toolchain-*.json
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: [checks, native_gate]
    env:
      REVIEWED_BUILD_NAME: ${{ needs.native_gate.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.native_gate.outputs.build_number || github.run_number }}
    name: Linux
    runs-on: ubuntu-latest
    if: >-
      always() && needs.checks.result == 'success' &&
      (needs.native_gate.result == 'success' || needs.native_gate.result == 'skipped') &&
      (github.event_name == 'push' || contains(github.event.inputs.platforms || 'macos,windows,linux', 'linux'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Apply candidate build identity
        run: dart tool/set_pubspec_version.dart --build-number "$BUILD_NUMBER" --build-name "$REVIEWED_BUILD_NAME"

      - name: Install Linux build & packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-dev \
            libdbusmenu-gtk3-dev \
            libnotify-dev \
            libmpv-dev \
            rpm \
            zip \
            zstd \
            dpkg

      - name: Setup Shorebird
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.action == 'release' ||
          github.event.inputs.action == 'patch' ||
          github.event.inputs.action == 'build'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Codegen (packages then app)
        run: bash tool/codegen.sh

      # Shorebird Release (Tag push or manual 'release')
      - name: Shorebird release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release')
        run: |
          BUILD_NAME="$(sed -n "s/^version: *\([^+]*\).*/\1/p" pubspec.yaml | head -n1)"
          shorebird release linux \
            --flutter-version 3.47.5 \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # Shorebird Patch (Manual 'patch')
      - name: Shorebird patch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'patch'
        run: |
          shorebird patch linux \
            --release-version "$PATCH_TARGET"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          PATCH_TARGET: ${{ github.event.inputs.release_version }}

      # Flutter Build (Manual 'build')
      - name: Candidate build (no upload)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build'
        run: shorebird release linux --dry-run --flutter-version 3.47.5 --build-number ${{ env.BUILD_NUMBER }}

      # Packaging (.deb, .rpm, .pkg.tar.zst, portable ZIP) - Only for release or build (not patch)
      - name: Package Linux installers and portable ZIP
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        run: |
          bash tool/packaging/build-deb.sh
          bash tool/packaging/build-rpm.sh
          bash tool/packaging/build-arch.sh
          VERSION="$(sed -n "s/^version: *\([^+]*\).*/\1/p" pubspec.yaml | head -n1)"
          mkdir -p dist
          ARCHIVE_ROOT="tawaq-${VERSION}-linux-x64"
          STAGING="$RUNNER_TEMP/$ARCHIVE_ROOT"
          mkdir -p "$STAGING/app" "$STAGING/icons"
          cp -R build/linux/x64/release/bundle/. "$STAGING/app/"
          cp -R linux/icons/hicolor "$STAGING/icons/hicolor"
          cp tool/packaging/installers/linux/install.sh "$STAGING/install.sh"
          cp tool/packaging/installers/linux/INSTALL.md "$STAGING/INSTALL.md"
          chmod +x "$STAGING/install.sh"
          (
            cd "$RUNNER_TEMP"
            zip -r -q "$GITHUB_WORKSPACE/dist/$ARCHIVE_ROOT.zip" "$ARCHIVE_ROOT"
          )

      - name: Record actual candidate toolchain
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        shell: bash
        run: python3 tool/release/record_toolchain.py --platform linux-x64 --output dist/toolchain-linux-x64.json --tool 'shorebird=shorebird --version' --tool 'clang=clang --version' --tool 'cmake=cmake --version' --tool 'rpm=rpm --version' --tool 'zstd=zstd --version'

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'patch')
        with:
          name: tawaq-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.zip
            dist/toolchain-*.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: >-
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release'))
    needs: [checks, native_gate, macos, windows, linux]
    runs-on: ubuntu-latest
    env:
      REVIEWED_BUILD_NAME: ${{ needs.native_gate.outputs.build_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: reviewed-candidate

      - name: Detect prerelease & tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${REVIEWED_BUILD_NAME}"
          fi

          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify complete artifact set against native acceptance
        env:
          NATIVE_ACCEPTANCE: ${{ github.event.inputs.native_acceptance }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path("native-acceptance.json").write_text(os.environ["NATIVE_ACCEPTANCE"])'
          SDK=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')
          python3 tool/release/validate_acceptance.py --record native-acceptance.json \
            --revision "$GITHUB_SHA" --sdk "$SDK" --platforms macos,windows,linux \
            --action release --verify-directory .

      - name: Stage and verify a coordinated GitHub release before publication
        run: |
          set -euo pipefail
          REPO="MoathCodes/tawaq-app"
          TAG="${{ steps.meta.outputs.tag }}"
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          gh --version > release-tools.txt
          # Refuse replacing any existing release. A partial draft remains
          # private for an operator to inspect/withdraw; it is never announced.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release already exists; inspect it before retrying" >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" \
            --draft --title "$TAG" --notes "Coordinated desktop release. See release-manifest.json for reviewed build identity and evidence."
          python3 tool/release/publish_assets.py --directory . --repo "$REPO" --tag "$TAG"
          gh release edit "$TAG" --repo "$REPO" --prerelease="$PRERELEASE" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
