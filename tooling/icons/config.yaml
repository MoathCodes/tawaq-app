# Original round uses ivory/gold; refined round uses one contrasting mark color.
# Geometry belongs to render.py; these are the only palette owners.
default: monogram
collections:
  original: [crescent, qaf, arch]
  refined: [monogram, lune, leaf]
designs:
  crescent:
    name: Crescent / jade
    background: '#123F43'
    foreground: '#FAF4E5'
    accent: '#EBC477'
  qaf:
    name: Qaf / plum
    background: '#422C58'
    foreground: '#FAF4E5'
    accent: '#EBC477'
  arch:
    name: Arch / clay
    background: '#813D30'
    foreground: '#FAF4E5'
    accent: '#F2C675'
  monogram:
    name: Qaf / porcelain
    background: '#EEEAE1'
    foreground: '#243D39'
  lune:
    name: Lune / ink
    background: '#172D32'
    foreground: '#EAEFE9'
  leaf:
    name: Leaf / slate
    background: '#26384A'
    foreground: '#EEF0EB'
