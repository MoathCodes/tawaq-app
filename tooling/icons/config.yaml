# Original round uses ivory/gold; refined round uses one contrasting mark color.
# Legacy geometry lives in render.py. Studio artwork and colors live in SVG masters.
default: folio_amber
collections:
  amber: [folio_amber, folio_ribbon]
  original: [crescent, qaf, arch]
  refined: [monogram, lune, leaf]
  studio: [folio, taw, pull]
  arabic: [folio_ribbon, folio_ta, folio_name]
