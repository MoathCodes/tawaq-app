<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 100 100" width="1024" height="1024">
<title>Tawaq — Folio, sage on parchment</title>
<desc>Two asymmetric folded manuscript planes meet at one rising seam.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#FFFDF7" offset="0"/><stop stop-color="#F0EADF" offset="1"/></linearGradient>
 <linearGradient id="left" x1="0.15" y1="0" x2="0.8" y2="1"><stop stop-color="#A5B57C" offset="0"/><stop stop-color="#718953" offset="0.5"/><stop stop-color="#425E3D" offset="1"/></linearGradient>
 <linearGradient id="right" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#B9C78D" offset="0"/><stop stop-color="#8DA461" offset="0.48"/><stop stop-color="#567B49" offset="1"/></linearGradient>
 <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#587144" offset="0"/><stop stop-color="#37583C" offset="1"/></linearGradient>
</defs>
<g id="surface" inkscape:label="Parchment surface"><rect x="3.5" y="3.5" width="93" height="93" rx="22" fill="url(#paper)" data-small-fill="#F7F4ED"/></g>
<g id="mark" inkscape:label="Folded manuscript">
 <path id="left-plane" d="M 24 28 C 38 29 48 39 48 53 L 48 76 C 33 69 22 57 22 42 C 22 36 23 31 24 28 Z" fill="url(#left)" data-small-fill="#527045"/>
 <path id="right-plane" d="M 77 24 C 62 26 53 36 52 51 L 52 76 C 67 69 80 57 80 42 C 80 35 79 29 77 24 Z" fill="url(#right)" data-small-fill="#6C8747"/>
 <g id="detail" inkscape:label="Fold shading">
  <path d="M 24 28 C 38 29 48 39 48 53 L 48 76 C 41 56 34 39 24 28 Z" fill="url(#fold)" opacity="0.66"/>
  <path d="M 77 24 C 62 26 53 36 52 51 L 52 76 C 55 52 65 34 77 24 Z" fill="#D1D9A1" opacity="0.26"/>
 </g>
</g>
</svg>
