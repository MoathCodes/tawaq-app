  adhan_dart:
    path: packages/adhan_dart
  cupertino_icons: ^1.0.8
  dorar_hadith:
    path: packages/dorar_hadith
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_screenutil_plus: ^1.4.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_timezone: ^5.0.0
  forui: ^0.17.0
  forui_hooks: ^0.17.0
  free_map: ^2.3.0
  freezed_annotation: ^3.0.0
  geolocator: ^14.0.2
  go_router: ^17.0.0
  hijriyah_indonesia: ^0.1.7
  hivez_flutter: ^1.2.2
  hooks_riverpod: ^3.0.3
  intl: ^0.20.2
  json_annotation: ^4.9.0
  lat_lng_to_timezone: ^0.2.0
  logger: ^2.6.2
  mushaf_reader:
