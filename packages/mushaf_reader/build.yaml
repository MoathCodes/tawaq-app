targets:
  $default:
    builders:
      freezed:
        options:
          # Dart 3.13 reserves `final` parameters for primary constructors.
          make_collections_unmodifiable: false
    # `flutter pub get` also resolves example/, which materializes
    # example/*/flutter/ephemeral/.plugin_symlinks. Those symlinked sources
    # fail annotation resolution, so keep codegen to the package itself.
    sources:
      - lib/**
      - pubspec.yaml
      - $package$
