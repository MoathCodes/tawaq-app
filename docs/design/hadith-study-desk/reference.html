<style>

.tool{display:flex;gap:6px;align-items:center;margin-bottom:12px;color:var(--mu);font-size:12px}.tool .sp{flex:1}
.note{display:flex;gap:12px;padding:14px 16px;background:#e9a91610;border:1px solid #e9a91640;border-radius:12px;color:var(--ac)}.note p{color:#cfc8bd;margin-top:4px}
.us{border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;background:var(--bg)}.us summary{padding:11px 16px;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}.us summary::-webkit-details-marker{display:none}.us summary span{color:var(--mu);font-size:12.5px;display:block}.us summary svg{margin-inline-start:auto;color:var(--mu);transition:.2s}.us[open] summary svg{transform:rotate(-90deg)}.us .ht{font-size:18px;padding:0 16px 10px;border-top:1px solid var(--bd)}
.mini{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 16px 12px;margin-bottom:10px;cursor:pointer}.mini:hover{border-color:#6b5a2f}.mini .ht{font-size:19px}
.lk{display:inline-flex;gap:6px;align-items:center;color:var(--ac);font-size:12.5px;margin-top:6px}
.kb{padding:14px 22px;border-top:1px solid var(--bd);color:var(--mu);font-size:12px;display:flex;gap:16px}kbd{border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:11px system-ui;margin-left:4px}

.hm{height:100%;overflow:auto}.in{max-width:1000px;margin:0 auto;padding:56px 32px}.in h1{font:700 36px/1.4 Amiri,serif}
.stat{display:flex;gap:22px;margin:8px 0 26px;color:var(--mu);font-size:12.5px}.stat b{color:var(--tx);font-weight:500}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:34px;margin-top:38px}
.tile{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;text-align:right;transition:.15s}.tile:hover{border-color:var(--ac)}.tile svg{color:var(--ac)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rc{display:flex;gap:10px;align-items:center;width:100%;padding:9px 4px;color:var(--mu);border-bottom:1px solid var(--bd)}.rc:hover{color:var(--tx)}.rc svg:last-child{margin-inline-start:auto}
.day{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px 22px 16px}.day small{color:var(--ac);font-size:12px}.day .ht{font-size:26px;line-height:2}
#dev{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;gap:3px;background:#000d;border:1px solid var(--bd);border-radius:14px;padding:5px;font:12px system-ui;direction:ltr}#dev button{padding:5px 10px;border-radius:9px;color:#aaa}#dev .on{background:var(--ac);color:#000}
</style></head><body>

const pg=()=>`<div class="pg"><button>→</button>${[1,2,3,4,5,'…',10].map(n=>`<button class="${n==1?'on':''}">${n}</button>`).join('')}<button>←</button></div>`;
const ac=h=>[['book','الشرح'],['link','التخريج'],h.us&&['star','أصول '+h.us],h.sim&&['eye','مشابهة '+h.sim],h.alt&&['left','بديل صحيح']].filter(Boolean).map(a=>`<span class="chip sm">${ic(a[0])}${a[1]}</span>`).join('');
const card=(h,i)=>`<article class="card g-${h.g} ${['detail','rl'].includes(S.v)&&S.sel==i?'sel':''}" data-i="${i}"><div class="acts"><span class="${h.sv?'on':''}" title="حفظ">${ic('mark')}</span><span title="نسخ">${ic('copy')}</span><span title="مشاركة">${ic('share')}</span></div><div class="ht">${hl(h.t)}</div><div class="row" style="margin-top:2px"><span class="bd g-${h.g}">${h.gl}</span>${h.c.map(c=>`<span class="chip sm tg">${c}</span>`).join('')}</div><div class="mt"><div><small>الراوي</small>${h.r}</div><div><small>المحدّث</small>${h.m}</div><div><small>المصدر</small>${h.b}</div></div><div class="row" style="margin-top:12px">${ac(h)}</div></article>`;
const mini=(x,i)=>`<div class="mini" ${i>=0?`data-i="${i}"`:''}><div class="ht">${x.t}</div><div class="row" style="margin-top:0"><span class="bd g-${x.g}">${x.gl}</span><span class="mu">${x.m} · ${x.b}</span></div></div>`;
const sk=n=>Array(n).fill(`<div class="card" style="box-shadow:none"><div class="sk" style="height:24px;width:92%"></div><div class="sk" style="height:24px;width:55%;margin-top:12px"></div><div class="sk" style="height:14px;width:40%;margin-top:22px"></div></div>`).join('');
const empty=()=>`<div class="st">${ic('search')}<h3>لا نتائج لـ «${Q}» بهذه الفلاتر</h3><p>جرّب البحث بأي كلمة بدل جميع الكلمات، أو خفّف الفلاتر.</p><div class="row"><span class="chip">إزالة فلتر الدرجة</span><span class="chip">أي كلمة</span><span class="chip">تضمين الشروح</span></div></div>`;
const ER=[['تعذّر الاتصال','لا يمكن الوصول إلى الدرر السنية. الكتب والمحدّثون والرواة ما زالت متاحة دون اتصال.'],['انتهت المهلة','لم يردّ الخادم خلال ١٥ ثانية بعد ٣ محاولات.'],['تجاوزت الحد المسموح','طلبات كثيرة في وقت قصير. حاول بعد قليل.']];
const err=()=>`<div class="st">${ic('warn')}<h3>${ER[S.et][0]}</h3><p>${ER[S.et][1]}</p><div class="row"><button class="go" data-search>إعادة المحاولة</button><button class="chip" data-v="home">تصفح دون اتصال</button></div><div class="row">${ER.map((e,i)=>`<span class="chip sm ${i==S.et?'on':''}" data-et="${i}">${e[0]}</span>`).join('')}</div></div>`;
const lst=()=>({loading:sk(3),empty:empty(),error:err(),saved:`<div class="mb"><b>المحفوظات</b><span>٢ حديثان</span></div>`+[0,3].map(i=>card(H[i],i)).join('')}[S.v]||(S.v=='offline'?`<div class="bn">${ic('off')}أنت غير متصل — تُعرض نتائج محفوظة مسبقًا<button class="chip">إعادة الاتصال</button></div>`:'')+H.map(card).join('')+pg());
const TABS=[['الشرح'],['سبب الورود'],['التخريج'],['الأصول'],['مشابهة'],['بديل صحيح']];
const P=[h=>`<div class="tool"><span>حجم الخط</span><button class="chip sm">أ-</button><button class="chip sm">أ+</button><span class="sp"></span><span class="chip sm">${ic('copy')}نسخ الشرح</span></div><p class="pr">يظهر هنا نص الشرح كما يرد في <code>sharhMetadata.sharh</code> بخط مريح للقراءة، مع تكبير الخط والبحث داخل الشرح.</p><p class="pr">وتُرتَّب أقوال العلماء في فقرات قابلة للطي.</p>`,
h=>`<div class="note">${ic('tag')}<div><b>سبب ورود الحديث <span class="chip sm">مقترح</span></b><p>عند توفر سبب الورود يُعرض هنا كبطاقة قصيرة تسبق الشرح، مع مصدره.</p></div></div>`,
h=>`<p class="pr">أخرجه مطولاً ابن ماجه (181) واللفظ له، وأحمد (16187) باختلاف يسير.</p>`,
h=>SRC.slice(0,h.us).map((s,i)=>`<details class="us" ${i?'':'open'}><summary>${ic('book')}<div><b style="font-weight:500">${s}</b><span>${h.r} ← … ← النبي ﷺ</span></div>${ic('left')}</summary><div class="ht">${h.t}</div></details>`).join('')+`<span class="lk">${ic('link')}فتح الأصول في الدرر السنية</span>`,
h=>H.filter(x=>x!=h).slice(0,Math.max(h.sim,1)).map(x=>mini(x,H.indexOf(x))).join(''),
h=>h.alt?`<p class="pr" style="font-size:13px;color:var(--mu)">حديث صحيح في المعنى نفسه:</p>`+mini(ALT,-1):`<p class="mu">لا يوجد بديل صحيح لهذا الحديث.</p>`];
const dis=(h,i)=>(i==3&&!h.us)||(i==4&&!h.sim)||(i==5&&!h.alt);
const rd=()=>{if(S.v=='rl')return`<div class="rh"><span class="sp"></span><button class="ib" data-go>${ic('x')}</button></div><div class="dh"><div class="sk" style="height:24px;width:70px"></div><div class="sk" style="height:30px;margin-top:22px"></div><div class="sk" style="height:30px;width:60%;margin-top:12px"></div></div><div class="kv" style="border:0">${[1,2,3].map(()=>`<div class="sk" style="height:18px;margin:14px 0"></div>`).join('')}</div>`;
if(S.v!='detail')return`<div class="st" style="padding-top:140px">${ic('book')}<p>اختر حديثًا لعرض الشرح والتخريج والأصول<br><span style="font-size:12px">استخدم ↑ ↓ للتنقل بين النتائج</span></p></div>`;
const h=H[S.sel];return`<div class="rh"><span class="bd g-${h.g}">${h.gl}</span><span class="sp"></span><button class="ib" title="حفظ">${ic('mark')}</button><button class="ib" title="نسخ">${ic('copy')}</button><button class="ib" title="مشاركة">${ic('share')}</button><button class="ib" title="فتح في الدرر السنية">${ic('link')}</button><button class="ib" data-go title="إغلاق (Esc)">${ic('x')}</button></div>
<div class="dh g-${h.g}"><div class="ht">${hl(h.t)}</div></div>
<div class="vd g-${h.g}"><small>حكم المحدّث</small><b>${h.gl}</b> <span class="mu">— ${h.m}</span></div>
<div class="kv"><div><span>الراوي</span><b>${h.r}</b></div><div><span>المحدّث</span><b>${h.m}</b></div><div><span>المصدر</span><b>${h.b}</b></div><div><span>التصنيف</span><span class="row" style="margin:0">${h.c.map(c=>`<span class="chip sm tg">${c}</span>`).join('')}</span></div></div>
<div class="tabs">${TABS.map((t,i)=>`<button class="${i==S.tab?'on':''} ${dis(h,i)?'dis':''}" data-tab="${i}">${t[0]}${i==3&&h.us?`<em>${h.us}</em>`:i==4&&h.sim?`<em>${h.sim}</em>`:''}</button>`).join('')}</div><div class="pn">${P[S.tab](h)}</div>`};
const rec=()=>['يضحك ربنا','الله نور','سبحان'].map(x=>`<button class="rc" data-search>${ic('clock')}${x}${ic('x')}</button>`).join('');
const home=()=>`<div class="hm"><div class="in"><h1>ابحث في السنّة النبوية</h1><div class="stat"><span><b>٢١</b> كتابًا</span><span><b>٢٠</b> محدّثًا</span><span><b>~١٤٬٠٠٠</b> راوٍ</span><span>متاحة دون اتصال</span></div>${sb('',1)}<div class="two"><section><h4>أبواب موضوعية</h4><div class="tiles">${CATS.map(c=>`<button class="tile">${ic('tag')}${c}</button>`).join('')}</div></section><section><h4>آخر عمليات البحث</h4>${rec()}<div style="margin-top:26px" class="day"><small>حديث اليوم</small><div class="ht">${H[0].t}</div><div class="row" style="margin-top:0"><span class="bd g-s">صحيح</span><span class="mu">${H[0].r} · ${H[0].b}</span></div></div></section></div></div></div>`;
const V=()=>S.v=='home'?home():`<div class="v1 ${S.fc?'':'nof'}"><aside class="fc">${facets()}</aside><section class="lst"><div class="lw">${sb(Q)}${S.v=='saved'?'':af()}${LV.includes(S.v)?mb():'<div style="height:16px"></div>'}${lst()}</div></section><aside class="rd">${rd()}</aside></div>`;
const DV=[['home','Home'],['loading','Loading'],['results','Results'],['detail','Detail'],['rl','Reader loading'],['empty','Empty'],['error','Error'],['offline','Offline'],['saved','Saved']];
function R(){const o=$('.lst'),st=o?o.scrollTop:0;
$('#rail').innerHTML=`<b>تواق</b>${[['home','home','الرئيسية'],['clock','','الأحدث'],['book','','الكتب'],['mic','results','الأحاديث'],['mark','saved','المحفوظات'],['shield','','التصنيفات']].map(([n,v,t])=>`<button title="${t}" ${v?`data-v="${v}"`:''} class="${(n=='home'&&S.v=='home')||(n=='mic'&&!['home','saved'].includes(S.v))||(n=='mark'&&S.v=='saved')?'on':''}">${ic(n)}</button>`).join('')}<span class="sp"></span><button title="الإعدادات">${ic('sl')}</button>`;
$('#top i').innerHTML=ic('play');$('#main').innerHTML=V();
$('#dev').innerHTML=DV.map(([v,l])=>`<button data-v="${v}" class="${S.v==v?'on':''}">${l}</button>`).join('');
const n=$('.lst');if(n)n.scrollTop=st}
function go(){S.v='loading';R();setTimeout(()=>{S.v='results';R()},900)}
document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let c;
if(c=q('[data-et]'))S.et=+c.dataset.et;
else if(c=q('[data-tab]'))S.tab=+c.dataset.tab;
else if(q('[data-search]'))return go();
else if(c=q('[data-v]')){S.v=c.dataset.v;if(S.v=='rl'||S.v=='detail')S.tab=0}
else if(q('[data-fc]'))S.fc=!S.fc;
else if(q('[data-go]'))S.v='results';
else if(c=q('[data-i]')){S.sel=+c.dataset.i;S.v='detail';S.tab=0}
else if(c=q('.gb .chip,.seg button,.g .chip')){if(c.parentNode.classList.contains('seg'))[...c.parentNode.children].forEach(b=>b.classList.toggle('on',b==c));else c.classList.toggle('on');return}
else return;R()});
document.addEventListener('keydown',e=>{const i=e.target.matches('input');
if(e.key=='Enter'&&i)return go();
if(i)return;
if(e.key=='/'){e.preventDefault();const f=$('.sb input');f&&f.focus();return}
if(e.key=='Escape'&&S.v=='detail'){S.v='results';R()}
else if(['ArrowDown','ArrowUp'].includes(e.key)&&['results','detail'].includes(S.v)){e.preventDefault();S.sel=Math.max(0,Math.min(H.length-1,S.sel+(e.key=='ArrowDown'?1:-1)));S.v='detail';S.tab=0;R()}
else if(e.key.toLowerCase()=='f'&&S.v!='home'){S.fc=!S.fc;R()}});
R();
</script></body></html>
